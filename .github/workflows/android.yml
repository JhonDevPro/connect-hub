name: Nexo Android (APK)

on:
  workflow_dispatch:
  push:
    tags: ["android-v*"]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Install Capacitor
        working-directory: android-app
        run: npm install
      - name: Create Android project
        working-directory: android-app
        run: npx cap add android
      - name: Add camera and microphone permissions
        working-directory: android-app
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n\n    <application#' $MANIFEST
      - name: Copy app icon
        working-directory: android-app
        run: |
          for d in android/app/src/main/res/mipmap-*; do
            cp ../public/pwa-512.png "$d/ic_launcher.png" 2>/dev/null || true
            cp ../public/pwa-512.png "$d/ic_launcher_round.png" 2>/dev/null || true
            cp ../public/pwa-512.png "$d/ic_launcher_foreground.png" 2>/dev/null || true
          done
      - name: Build APK
        working-directory: android-app
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Nexo-Android-APK
          path: android-app/android/app/build/outputs/apk/debug/*.apk
